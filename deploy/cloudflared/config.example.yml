# Ejemplo de configuración para túnel de Cloudflare (cloudflared)
tunnel: <TUNNEL_ID>
credentials-file: /root/.cloudflared/<TUNNEL_ID>.json

ingress:
  # Apunta al servicio Nginx en el contenedor Docker
  - hostname: gorotv.tudominio.com
    service: http://localhost:80
  - service: http_status:404
